name: all-states data package

on:
  workflow_dispatch:
    inputs:
      acs_year:
        description: ACS/Gazetteer release year
        default: "2024"
        required: true
      allow_missing_acs:
        description: Allow states with no ACS data
        type: boolean
        default: false
      mark_publication_ready:
        description: Fail if any readiness gates remain unresolved
        type: boolean
        default: true
      resolutions_file:
        description: Path to gate resolutions JSON
        default: work/gate_resolutions.json
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Build all-states data package
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python scripts/build_all_states_data_package.py \
            --output-dir work/all-states/${{ github.run_id }} \
            --acs-year ${{ inputs.acs_year }} \
            --api-key "$CENSUS_API_KEY" \
            ${{ inputs.allow_missing_acs && '--allow-missing-acs' || '' }} \
            ${{ inputs.mark_publication_ready && '--mark-publication-ready' || '' }} \
            ${{ inputs.resolutions_file && format('--resolutions-file {0}', inputs.resolutions_file) || '' }}
      - name: Upload all-states data package
        uses: actions/upload-artifact@v4
        with:
          name: all-states-data-package-${{ github.run_id }}
          path: work/all-states/${{ github.run_id }}/
          if-no-files-found: error
