name: quarterly snapshot template

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 1 */3 *"

jobs:
  disabled-until-configured:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_QUARTERLY_SNAPSHOT == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Stop until source workflow is configured
        run: |
          echo "Configure reviewed source retrieval, credentials, and adjudication before enabling."
          exit 1
