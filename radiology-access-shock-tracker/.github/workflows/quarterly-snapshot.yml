name: quarterly MQSA source refresh

on:
  workflow_dispatch:
    inputs:
      state:
        description: Two-letter state filter for the MQSA review worklist.
        default: NC
        required: true
      action:
        description: "Action: prepare (default), resolve-gate, or finalize-and-resolve."
        default: prepare
        required: false
      reviewed_csv:
        description: "Relative path to the reviewed CSV (for finalize-and-resolve)."
        required: false
      evidence_ref:
        description: "Evidence reference for gate resolution (e.g. PR # or review URL)."
        required: false

permissions:
  contents: read

jobs:
  prepare-mqsa-review-artifact:
    if: ${{ inputs.action == '' || inputs.action == 'prepare' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Fetch FDA MQSA public source
        shell: bash
        run: |
          radshock fetch-fda-mqsa --output-dir work/source-refresh/raw --force
          archive_path="$(find work/source-refresh/raw/fda-mqsa-public -name public.zip -type f | sort | tail -n 1)"
          if [ -z "${archive_path}" ]; then
            echo "FDA MQSA archive was not created."
            exit 1
          fi
          run_date="$(basename "$(dirname "${archive_path}")")"
          echo "RUN_DATE=${run_date}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_PATH=${archive_path}" >> "${GITHUB_ENV}"
      - name: Prepare MQSA review worklist
        shell: bash
        env:
          STATE_FILTER: ${{ inputs.state || 'NC' }}
        run: |
          state_upper="$(echo "${STATE_FILTER}" | tr '[:lower:]' '[:upper:]')"
          echo "STATE_FILTER=${state_upper}" >> "${GITHUB_ENV}"
          mkdir -p work/source-refresh/review
          radshock prepare-mqsa-review \
            "${ARCHIVE_PATH}" \
            --output-csv "work/source-refresh/review/fda_mqsa_${RUN_DATE}_${state_upper}_review.csv" \
            --state "${state_upper}" \
            --force
      - name: Geocode MQSA review
        shell: bash
        run: |
          radshock geocode-mqsa-review \
            "work/source-refresh/review/fda_mqsa_${RUN_DATE}_${state_upper}_review.csv" \
            --output-csv "work/source-refresh/review/fda_mqsa_${RUN_DATE}_${state_upper}_geocoded.csv" \
            --provider census \
            --overwrite-coordinates \
            --force
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mqsa-review-artifacts
          path: |
            work/source-refresh/raw/fda-mqsa-public/*/public.zip.metadata.json
            work/source-refresh/review/*.csv
          if-no-files-found: error

  resolve-gate:
    if: ${{ inputs.action == 'resolve-gate' || inputs.action == 'finalize-and-resolve' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Finalize MQSA review (if reviewed CSV provided)
        if: ${{ inputs.action == 'finalize-and-resolve' && inputs.reviewed_csv != '' }}
        shell: bash
        env:
          STATE_FILTER: ${{ inputs.state || 'NC' }}
          REVIEWED_CSV: ${{ inputs.reviewed_csv }}
        run: |
          state_upper="$(echo "${STATE_FILTER}" | tr '[:lower:]' '[:upper:]')"
          radshock finalize-mqsa-review "${REVIEWED_CSV}" \
            --output-csv "work/snapshots/facilities_${state_upper}.csv" \
            --force
          radshock ingest-snapshot "work/snapshots/facilities_${state_upper}.csv" \
            --as-of "$(date +%Y-%m-%d)" \
            --source-name "fda-mqsa-public"
      - name: Resolve MQSA gate
        shell: bash
        env:
          STATE_FILTER: ${{ inputs.state || 'NC' }}
          EVIDENCE_REF: ${{ inputs.evidence_ref || 'Reviewed via quarterly snapshot workflow' }}
        run: |
          state_upper="$(echo "${STATE_FILTER}" | tr '[:lower:]' '[:upper:]')"
          radshock resolve-gate mqsa_review "${state_upper}" \
            --evidence "${EVIDENCE_REF}" \
            --resolved-by "quarterly-snapshot-ci"
