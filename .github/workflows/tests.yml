name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/radshock
      - run: pytest
      - run: python -m pip wheel . -w dist
      - run: radshock demo --output-dir outputs/demo-smoke
      - name: Streamlit smoke test
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import time
          import urllib.request

          port = 8507
          process = subprocess.Popen(
              [
                  sys.executable,
                  "-m",
                  "streamlit",
                  "run",
                  "src/radshock/app.py",
                  "--server.headless=true",
                  f"--server.port={port}",
                  "--server.address=127.0.0.1",
                  "--browser.gatherUsageStats=false",
              ],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          try:
              deadline = time.time() + 30
              while time.time() < deadline:
                  time.sleep(1)
                  try:
                      with urllib.request.urlopen(
                          f"http://127.0.0.1:{port}/_stcore/health", timeout=2
                      ) as response:
                          if response.status == 200:
                              break
                  except Exception:
                      if process.poll() is not None:
                          raise
              else:
                  raise SystemExit("Streamlit health check failed")
          finally:
              if process.poll() is None:
                  process.terminate()
                  process.wait(timeout=10)
          PY

  release-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Build source and journal release packages
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\package_release.ps1
      - name: Generate direct-dependency SBOM
        run: python scripts/generate_sbom.py --output dist/radiology-access-shock-tracker-sbom.cdx.json
      - name: Verify release package manifest
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -LiteralPath dist -Filter "release-package-manifest-*.json" |
            Select-Object -First 1
          if ($null -eq $manifest) {
            throw "No release package manifest was generated."
          }
          $data = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json
          foreach ($artifact in @($data.github_source_zip, $data.journal_bundle_zip)) {
            if (-not (Test-Path -LiteralPath $artifact.path)) {
              throw "Packaged artifact is missing: $($artifact.path)"
            }
            if ($artifact.bytes -le 0) {
              throw "Packaged artifact is empty: $($artifact.path)"
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.path).Hash.ToLowerInvariant()
            if ($actualHash -ne $artifact.sha256) {
              throw "SHA-256 mismatch for $($artifact.path)"
            }
          }
          $sbom = "dist/radiology-access-shock-tracker-sbom.cdx.json"
          if (-not (Test-Path -LiteralPath $sbom)) {
            throw "SBOM was not generated."
          }
          $sbomJson = Get-Content -LiteralPath $sbom -Raw | ConvertFrom-Json
          if ($sbomJson.bomFormat -ne "CycloneDX") {
            throw "Unexpected SBOM format: $($sbomJson.bomFormat)"
          }
