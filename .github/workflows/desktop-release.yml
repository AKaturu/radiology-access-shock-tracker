name: desktop release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish artifacts to a GitHub Release.
        type: boolean
        default: false
        required: false
      release_tag:
        description: Release tag to publish when manually dispatched, for example v0.2.0.
        default: ""
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-x64
            package_name: RadiologyAccessShockTracker-windows-x64.zip
            windowed: "true"
          - os: ubuntu-latest
            artifact_name: linux-x64
            package_name: RadiologyAccessShockTracker-linux-x64.tar.gz
            windowed: "false"
          - os: macos-15-intel
            artifact_name: macos-x64
            package_name: RadiologyAccessShockTracker-macos-x64.dmg
            windowed: "true"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install package and desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"

      - name: Validate bundled desktop payload
        run: python -m radshock.desktop --check

      - name: Build desktop app
        shell: bash
        run: |
          if [ "${{ matrix.windowed }}" = "true" ]; then
            python scripts/build_desktop.py --windowed
          else
            python scripts/build_desktop.py
          fi

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/desktop/RadiologyAccessShockTracker `
            -DestinationPath dist/${{ matrix.package_name }} `
            -Force

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: |
          tar -czf dist/${{ matrix.package_name }} -C dist/desktop RadiologyAccessShockTracker

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          hdiutil create \
            -volname RadiologyAccessShockTracker \
            -srcfolder dist/desktop/RadiologyAccessShockTracker.app \
            -ov \
            -format UDZO \
            dist/${{ matrix.package_name }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.package_name }}
          if-no-files-found: error

      - name: Write artifact checksum
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib

          package = pathlib.Path("dist") / "${{ matrix.package_name }}"
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          package.with_suffix(package.suffix + ".sha256").write_text(
              f"{digest}  {package.name}\n"
          )
          PY

      - name: Upload checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}-sha256
          path: dist/${{ matrix.package_name }}.sha256
          if-no-files-found: error

  publish-release:
    name: publish GitHub release
    needs: build-desktop
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.release_tag }}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+ ]]; then
            echo "Release tag must look like v0.2.0; got '${tag}'." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate release SBOM
        run: python scripts/generate_sbom.py --output dist/release/radiology-access-shock-tracker-sbom.cdx.json

      - name: Write release SBOM checksum
        shell: bash
        run: |
          cd dist/release
          python - <<'PY'
          import hashlib
          import pathlib

          sbom = pathlib.Path("radiology-access-shock-tracker-sbom.cdx.json")
          digest = hashlib.sha256(sbom.read_bytes()).hexdigest()
          pathlib.Path(f"{sbom.name}.sha256").write_text(f"{digest}  {sbom.name}\n")
          PY

      - name: Write release notes
        shell: bash
        run: |
          cat > dist/release-notes.md <<EOF
          # Radiology Access Shock Tracker ${{ steps.release.outputs.tag }}

          Production-ready 51-jurisdiction package release.

          ## Highlights

          - 51 jurisdictions included: all 50 states plus DC.
          - All-state package rebuilt with Census ACS county and tract context.
          - Production audit is READY with 0 blockers and 0 warnings.
          - All 153 state readiness gates are resolved with human-review evidence.
          - Placeholder all-state facility snapshots are blocked; future snapshots must come from completed MQSA review CSVs.

          ## Desktop Downloads

          - Windows: `RadiologyAccessShockTracker-windows-x64.zip` contains `RadiologyAccessShockTracker.exe`.
          - macOS: `RadiologyAccessShockTracker-macos-x64.dmg`.
          - Linux: `RadiologyAccessShockTracker-linux-x64.tar.gz`.
          - Checksums: each downloadable asset has a `.sha256` companion file.
          - SBOM: `radiology-access-shock-tracker-sbom.cdx.json`.

          These builds are unsigned, so Windows SmartScreen and macOS Gatekeeper may warn on first launch.
          EOF

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/release/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/release/* \
              --title "Radiology Access Shock Tracker ${RELEASE_TAG}" \
              --notes-file dist/release-notes.md
          fi
